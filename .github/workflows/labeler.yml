name: Label pull requests

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Apply labels
        uses: actions/labeler@v7
        with:
          sync-labels: true
