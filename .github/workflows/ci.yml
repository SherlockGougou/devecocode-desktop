name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Frontend and Rust checks
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Check version consistency
        run: npm run check:version

      - name: Check automation scripts
        run: |
          node --check scripts/bump-version.mjs
          node --check scripts/render-homebrew-casks.mjs
          node --check scripts/stage-offline-cli.mjs
          node --check scripts/build-offline.mjs
          node --check scripts/render-release-notes.mjs
          node --check scripts/render-updater-manifests.mjs
          node --check scripts/updater/prepare-fixtures.mjs
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.offline.conf.json'))"
          node -e "JSON.parse(require('fs').readFileSync('src-tauri/tauri.updater.conf.json'))"
          node scripts/updater/prepare-fixtures.mjs --out "$RUNNER_TEMP/updater-fixture-assets"
          node scripts/render-updater-manifests.mjs \
            --tag v0.2.3 \
            --repo example/repo \
            --assets "$RUNNER_TEMP/updater-fixture-assets" \
            --out "$RUNNER_TEMP/updater-manifests" \
            --pub-date 2026-11-08T00:00:00Z
          diff -u scripts/updater/fixtures/expected/latest.json "$RUNNER_TEMP/updater-manifests/latest.json"
          diff -u scripts/updater/fixtures/expected/latest-offline.json "$RUNNER_TEMP/updater-manifests/latest-offline.json"
          if node scripts/render-updater-manifests.mjs \
            --tag v0.2.4 \
            --repo example/repo \
            --assets "$RUNNER_TEMP/updater-fixture-assets" \
            --out "$RUNNER_TEMP/updater-bad-version"; then
            echo "版本不匹配的清单不应生成成功"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/updater-missing-signature"
          cp "$RUNNER_TEMP/updater-fixture-assets/"* "$RUNNER_TEMP/updater-missing-signature/"
          rm "$RUNNER_TEMP/updater-missing-signature/DevEco.Code_0.2.3_aarch64.app.tar.gz.sig"
          if node scripts/render-updater-manifests.mjs \
            --tag v0.2.3 \
            --repo example/repo \
            --assets "$RUNNER_TEMP/updater-missing-signature" \
            --out "$RUNNER_TEMP/updater-missing-signature-out"; then
            echo "缺少签名时不应生成清单"
            exit 1
          fi
          node scripts/render-homebrew-casks.mjs \
            --version v0.0.0 \
            --sums scripts/homebrew/SHA256SUMS.fixture \
            --out-dir "$RUNNER_TEMP/homebrew-casks"
          ruby -c "$RUNNER_TEMP/homebrew-casks/devecocode-desktop.rb"
          ruby -c "$RUNNER_TEMP/homebrew-casks/devecocode-desktop-offline.rb"
          brew style "$RUNNER_TEMP/homebrew-casks/devecocode-desktop.rb" \
            "$RUNNER_TEMP/homebrew-casks/devecocode-desktop-offline.rb"

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Build frontend
        run: npm --prefix ui run build

      - name: Check Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features selftest -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  offline-resources:
    name: Offline resources ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CLI_PLATFORM: ${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}
      CLI_VERSION: 0.2.5
      CLI_COMMON_VERSION: 1.3.4

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pinned CLI packages
        run: |
          npm install --ignore-scripts --omit=optional \
            --prefix "$RUNNER_TEMP/offline-cli" \
            "@deveco/deveco-code@$CLI_VERSION" \
            "@deveco/deveco-cli@1.3.4" \
            "@deveco/deveco-cli-common@$CLI_COMMON_VERSION"

      - name: Pack target CLI binary
        run: |
          mkdir -p "$RUNNER_TEMP/offline-cli-platform"
          npm pack --pack-destination "$RUNNER_TEMP/offline-cli-platform" \
            "@deveco/deveco-code-${CLI_PLATFORM}@$CLI_VERSION"
          tar -xzf "$RUNNER_TEMP/offline-cli-platform/"*.tgz \
            -C "$RUNNER_TEMP/offline-cli-platform"

      - name: Stage offline resources
        run: |
          node scripts/stage-offline-cli.mjs \
            --target "$TARGET" \
            --source "$RUNNER_TEMP/offline-cli/node_modules/@deveco/deveco-code" \
            --node-modules "$RUNNER_TEMP/offline-cli/node_modules" \
            --platform-source "$RUNNER_TEMP/offline-cli-platform/package"
          test -f src-tauri/resources/cli/manifest.json
          test -x src-tauri/resources/cli/bin/deveco
          node -e "const m=require('./src-tauri/resources/cli/manifest.json'); if(m.target!=='$TARGET') process.exit(1)"
