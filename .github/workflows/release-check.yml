name: Release readiness

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "准备发布的标签，例如 v0.2.2"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.inputs.tag }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version and release notes
        run: |
          node scripts/check-release-version.mjs "$RELEASE_TAG"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          const updater = config.plugins?.updater;
          if (!updater?.pubkey || updater.pubkey.includes("REPLACE")) {
            throw new Error("tauri.conf.json 缺少 updater 公钥");
          }
          if (!Array.isArray(updater.endpoints) || updater.endpoints.length === 0) {
            throw new Error("tauri.conf.json 缺少 updater 端点");
          }
          if (updater.requireSignedVersion !== true) {
            throw new Error("updater 必须启用 requireSignedVersion");
          }
          for (const endpoint of updater.endpoints) {
            if (!endpoint.startsWith("https://")) {
              throw new Error(`updater 端点必须使用 HTTPS：${endpoint}`);
            }
          }
          const offline = JSON.parse(
            readFileSync("src-tauri/tauri.offline.conf.json", "utf8"),
          );
          const offlineEndpoints = offline.plugins?.updater?.endpoints;
          if (!Array.isArray(offlineEndpoints) || offlineEndpoints.length === 0) {
            throw new Error("Offline 配置缺少独立 updater 端点");
          }
          if (!offlineEndpoints.every((endpoint) => endpoint.startsWith("https://"))) {
            throw new Error("Offline updater 端点必须使用 HTTPS");
          }
          JSON.parse(readFileSync("src-tauri/tauri.updater.conf.json", "utf8"));
          NODE
          node scripts/render-release-notes.mjs "$RELEASE_TAG" .release-notes.md
          test -s .release-notes.md
          if grep -q "{{" .release-notes.md; then
            echo "Release notes 仍包含占位符"
            exit 1
          fi

      - name: Upload notes preview
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-preview
          path: .release-notes.md
          include-hidden-files: true
          if-no-files-found: error
