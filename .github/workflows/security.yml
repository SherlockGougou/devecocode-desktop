name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  issues: write

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Audit Cargo dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # 以下均为 Tauri 的 Linux-only 传递依赖；本项目只发布 macOS，
          # macOS 目标不会编译这些 crate。
          # RUSTSEC-2024-0429: glib
          # RUSTSEC-2024-0370: proc-macro-error（经 glib-macros 引入）
          # RUSTSEC-2026-0370 / 0371 / 0372: zvariant / zbus_names / zvariant_derive（经 zbus 引入）
          ignore: RUSTSEC-2024-0429,RUSTSEC-2024-0370,RUSTSEC-2026-0370,RUSTSEC-2026-0371,RUSTSEC-2026-0372
