name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的版本标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Verify version matches tag
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error title=Missing updater signing key::Set TAURI_SIGNING_PRIVATE_KEY in repository secrets."
            exit 1
          }

      - name: Build and publish unsigned macOS bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 有意不注入 APPLE_* 证书或公证凭据，保持 ad-hoc 签名。
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "DevEco Code Desktop ${{ env.RELEASE_TAG }}"
          releaseBody: "Release notes will be added after all macOS assets are built."
          # 先写入 draft；offline、双语 notes 和 checksums 完成后再统一发布。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          retryAttempts: 2
          tauriScript: "npm run tauri"
          args: "--target ${{ matrix.target }} --config src-tauri/tauri.updater.conf.json"
          # 两个架构分别生成会互相覆盖；由 checksums job 统一生成最新清单。
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "DevEco-Code-Desktop-[arch]-[bundle]"

      - name: Attest standard build provenance
        uses: actions/attest@v4
        with:
          # DMG 是用户实际下载的普通版资产；release immutability 还会生成 release attestation。
          subject-path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  offline:
    name: Offline ${{ matrix.target }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CLI_PLATFORM: ${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}
      CLI_VERSION: 0.2.5
      CLI_COMMON_VERSION: 1.3.4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Install pinned CLI packages
        run: |
          npm install --ignore-scripts --omit=optional \
            --prefix "$RUNNER_TEMP/offline-cli" \
            "@deveco/deveco-code@$CLI_VERSION" \
            "@deveco/deveco-cli@1.3.4" \
            "@deveco/deveco-cli-common@$CLI_COMMON_VERSION"

      - name: Pack target-specific CLI binary
        run: |
          mkdir -p "$RUNNER_TEMP/offline-cli-platform"
          npm pack --pack-destination "$RUNNER_TEMP/offline-cli-platform" \
            "@deveco/deveco-code-${CLI_PLATFORM}@$CLI_VERSION"
          tar -xzf "$RUNNER_TEMP/offline-cli-platform/"*.tgz \
            -C "$RUNNER_TEMP/offline-cli-platform"

      - name: Stage bundled CLI
        run: |
          node scripts/stage-offline-cli.mjs \
            --target "$TARGET" \
            --source "$RUNNER_TEMP/offline-cli/node_modules/@deveco/deveco-code" \
            --node-modules "$RUNNER_TEMP/offline-cli/node_modules" \
            --platform-source "$RUNNER_TEMP/offline-cli-platform/package"

      - name: Verify version matches tag
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Verify updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error title=Missing updater signing key::Set TAURI_SIGNING_PRIVATE_KEY in repository secrets."
            exit 1
          }

      - name: Build offline bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build \
            --config src-tauri/tauri.offline.conf.json \
            --config src-tauri/tauri.updater.conf.json \
            --target "$TARGET"

      - name: Verify bundled resources
        run: |
          APP="src-tauri/target/$TARGET/release/bundle/macos/DevEco Code Offline.app"
          test -f "$APP/Contents/Resources/bundled-cli/manifest.json"
          test -x "$APP/Contents/Resources/bundled-cli/bin/deveco"
          codesign --verify --deep --strict "$APP"

      - name: Package release assets
        run: |
          mkdir -p .artifacts
          APP="src-tauri/target/$TARGET/release/bundle/macos/DevEco Code Offline.app"
          DMG=$(find "src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name 'DevEco Code Offline_*.dmg' -print -quit)
          test -n "$DMG"
          TARBALL=$(find "src-tauri/target/$TARGET/release/bundle/macos" -maxdepth 1 -name 'DevEco Code Offline_*.app.tar.gz' -print -quit)
          test -n "$TARBALL"
          test -f "${TARBALL}.sig"
          tar -tzf "$TARBALL" | grep -q 'DevEco Code Offline.app/Contents/Info.plist'
          VERSION="${RELEASE_TAG#v}"
          case "$TARGET" in
            aarch64-*) ARCH="aarch64" ;;
            *) ARCH="x64" ;;
          esac
          ditto -c -k --sequesterRsrc --keepParent "$APP" ".artifacts/DevEco-Code-Offline_${RELEASE_TAG}_${CLI_PLATFORM}.app.zip"
          cp "$DMG" .artifacts/
          cp "$TARBALL" ".artifacts/DevEco.Code.Offline_${VERSION}_${ARCH}.app.tar.gz"
          cp "${TARBALL}.sig" ".artifacts/DevEco.Code.Offline_${VERSION}_${ARCH}.app.tar.gz.sig"
          ls -lh .artifacts

      - name: Attest offline build provenance
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: offline-${{ matrix.target }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload offline assets to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: .artifacts/*
          # softprops 默认 draft=false，会顺手发布现有草稿；这里必须显式保持 draft。
          draft: true
          fail_on_unmatched_files: true

  checksums:
    name: Generate release checksums
    needs: [build, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')" = "true"

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber
          # 重跑时不要把上一次的校验和或 manifest 算进去。
          rm -f release-assets/SHA256SUMS.txt \
                release-assets/latest.json \
                release-assets/latest-offline.json
          test -n "$(find release-assets -maxdepth 1 -type f -print | head -n 1)"

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print | sed 's#^\./##' | sort | while IFS= read -r file; do
            sha256sum "$file"
          done > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          sha256sum -c ../SHA256SUMS.txt

      - name: Upload SHA256SUMS to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Generate updater manifests
        run: |
          node scripts/render-updater-manifests.mjs \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --assets release-assets \
            --out .
          test -s latest.json
          test -s latest-offline.json

      - name: Upload updater manifests to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" latest.json latest-offline.json \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: |
            SHA256SUMS.txt
            latest.json
            latest-offline.json
          if-no-files-found: error

  release-notes:
    name: Prepare bilingual release notes
    needs: [build, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Render bilingual release notes
        run: node scripts/render-release-notes.mjs "$RELEASE_TAG" .release-notes.md

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')" = "true"

      - name: Update GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file .release-notes.md

  publish:
    name: Publish draft release
    needs: [build, offline, checksums, release-notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')"
          test "$is_draft" = "true"

          assets="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name')"
          printf '%s\n' "$assets"

          grep -qx 'SHA256SUMS.txt' <<< "$assets"
          grep -qx 'latest.json' <<< "$assets"
          grep -qx 'latest-offline.json' <<< "$assets"
          dmg_count="$(grep -c '\.dmg$' <<< "$assets" || true)"
          zip_count="$(grep -c '\.app\.zip$' <<< "$assets" || true)"
          tar_count="$(grep -c '\.app\.tar\.gz$' <<< "$assets" || true)"
          sig_count="$(grep -c '\.app\.tar\.gz\.sig$' <<< "$assets" || true)"
          # 普通版 2 个 DMG + Offline 版 2 个 DMG；Offline 版另有 2 个 .app.zip。
          test "$dmg_count" -ge 4
          test "$zip_count" -ge 2
          # 两个版本各 2 个架构的更新包和签名。
          test "$tar_count" -ge 4
          test "$sig_count" -ge 4

          body="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body')"
          grep -q '## 中文' <<< "$body"
          grep -q '## English' <<< "$body"

      - name: Download and validate updater manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf updater-manifests
          mkdir -p updater-manifests
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --pattern 'latest*.json' \
            --dir updater-manifests \
            --clobber
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const version = process.env.RELEASE_TAG.replace(/^v/, "");
          const manifestFiles = ["latest.json", "latest-offline.json"];
          const keys = [
            "darwin-aarch64",
            "darwin-aarch64-app",
            "darwin-x86_64",
            "darwin-x86_64-app",
          ];
          for (const file of manifestFiles) {
            const manifest = JSON.parse(
              readFileSync(`updater-manifests/${file}`, "utf8"),
            );
            if (manifest.version !== version) {
              throw new Error(`${file} 版本 ${manifest.version} 与 ${version} 不一致`);
            }
            for (const key of keys) {
              const platform = manifest.platforms?.[key];
              if (!platform) throw new Error(`${file} 缺少 ${key}`);
              if (!platform.url.startsWith("https://github.com/")) {
                throw new Error(`${file} ${key} 的下载地址不是 GitHub HTTPS`);
              }
              let decoded = platform.signature;
              if (!decoded.includes("trusted comment:")) {
                decoded = Buffer.from(decoded, "base64").toString("utf8");
              }
              if (!decoded.includes("trusted comment:")) {
                throw new Error(`${file} ${key} 的签名不完整`);
              }
            }
          }
          NODE

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false

      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          immutable="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isImmutable \
            --jq '.isImmutable' 2>/dev/null || echo unknown)"
          if [ "$immutable" != "true" ]; then
            echo "::warning title=Release immutability not enabled::Enable Settings → Releases → Enable release immutability. This release was published mutable."
          else
            echo "Release is immutable."
          fi
