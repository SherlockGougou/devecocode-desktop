name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的版本标签，例如 v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Verify version matches tag
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Build and publish unsigned macOS bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 有意不注入 APPLE_* 证书或公证凭据，保持 ad-hoc 签名。
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "DevEco Code Desktop ${{ env.RELEASE_TAG }}"
          releaseBody: "Release notes will be added after all macOS assets are built."
          # 先写入 draft；offline、双语 notes 和 checksums 完成后再统一发布。
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          retryAttempts: 2
          tauriScript: "npm run tauri"
          args: "--target ${{ matrix.target }}"
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "DevEco-Code-Desktop-[arch]-[bundle]"

      - name: Attest standard DMG build provenance
        uses: actions/attest@v4
        with:
          # DMG 是用户实际下载的普通版资产；release immutability 还会生成 release attestation。
          subject-path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  offline:
    name: Offline ${{ matrix.target }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CLI_PLATFORM: ${{ matrix.target == 'aarch64-apple-darwin' && 'darwin-arm64' || 'darwin-x64' }}
      CLI_VERSION: 0.2.5
      CLI_COMMON_VERSION: 1.3.4

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Install pinned CLI packages
        run: |
          npm install --ignore-scripts --omit=optional \
            --prefix "$RUNNER_TEMP/offline-cli" \
            "@deveco/deveco-code@$CLI_VERSION" \
            "@deveco/deveco-cli@1.3.4" \
            "@deveco/deveco-cli-common@$CLI_COMMON_VERSION"

      - name: Pack target-specific CLI binary
        run: |
          mkdir -p "$RUNNER_TEMP/offline-cli-platform"
          npm pack --pack-destination "$RUNNER_TEMP/offline-cli-platform" \
            "@deveco/deveco-code-${CLI_PLATFORM}@$CLI_VERSION"
          tar -xzf "$RUNNER_TEMP/offline-cli-platform/"*.tgz \
            -C "$RUNNER_TEMP/offline-cli-platform"

      - name: Stage bundled CLI
        run: |
          node scripts/stage-offline-cli.mjs \
            --target "$TARGET" \
            --source "$RUNNER_TEMP/offline-cli/node_modules/@deveco/deveco-code" \
            --node-modules "$RUNNER_TEMP/offline-cli/node_modules" \
            --platform-source "$RUNNER_TEMP/offline-cli-platform/package"

      - name: Verify version matches tag
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Build offline bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          npx tauri build \
            --config src-tauri/tauri.offline.conf.json \
            --target "$TARGET"

      - name: Verify bundled resources
        run: |
          APP="src-tauri/target/$TARGET/release/bundle/macos/DevEco Code Offline.app"
          test -f "$APP/Contents/Resources/bundled-cli/manifest.json"
          test -x "$APP/Contents/Resources/bundled-cli/bin/deveco"
          codesign --verify --deep --strict "$APP"

      - name: Package release assets
        run: |
          mkdir -p .artifacts
          APP="src-tauri/target/$TARGET/release/bundle/macos/DevEco Code Offline.app"
          DMG=$(find "src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name 'DevEco Code Offline_*.dmg' -print -quit)
          test -n "$DMG"
          ditto -c -k --sequesterRsrc --keepParent "$APP" ".artifacts/DevEco-Code-Offline_${RELEASE_TAG}_${CLI_PLATFORM}.app.zip"
          cp "$DMG" .artifacts/
          ls -lh .artifacts

      - name: Attest offline build provenance
        uses: actions/attest@v4
        with:
          subject-path: .artifacts/*

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: offline-${{ matrix.target }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload offline assets to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: .artifacts/*
          # softprops 默认 draft=false，会顺手发布现有草稿；这里必须显式保持 draft。
          draft: true
          fail_on_unmatched_files: true

  checksums:
    name: Generate release checksums
    needs: [build, offline]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')" = "true"

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --clobber
          # 重跑时不要把上一次的校验和文件算进去。
          rm -f release-assets/SHA256SUMS.txt
          test -n "$(find release-assets -maxdepth 1 -type f -print | head -n 1)"

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          find . -maxdepth 1 -type f -print | sed 's#^\./##' | sort | while IFS= read -r file; do
            sha256sum "$file"
          done > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt
          sha256sum -c ../SHA256SUMS.txt

      - name: Upload SHA256SUMS to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error

  release-notes:
    name: Prepare bilingual release notes
    needs: [build, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render bilingual release notes
        run: node scripts/render-release-notes.mjs "$RELEASE_TAG" .release-notes.md

      - name: Verify draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')" = "true"

      - name: Update GitHub Release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --notes-file .release-notes.md

  publish:
    name: Publish draft release
    needs: [build, offline, checksums, release-notes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isDraft \
            --jq '.isDraft')"
          test "$is_draft" = "true"

          assets="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json assets \
            --jq '.assets[].name')"
          printf '%s\n' "$assets"

          grep -qx 'SHA256SUMS.txt' <<< "$assets"
          dmg_count="$(grep -c '\.dmg$' <<< "$assets" || true)"
          zip_count="$(grep -c '\.app\.zip$' <<< "$assets" || true)"
          # 普通版 2 个 DMG + Offline 版 2 个 DMG；Offline 版另有 2 个 .app.zip。
          test "$dmg_count" -ge 4
          test "$zip_count" -ge 2

          body="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body')"
          grep -q '## 中文' <<< "$body"
          grep -q '## English' <<< "$body"

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --draft=false

      - name: Verify release immutability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          immutable="$(gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --json isImmutable \
            --jq '.isImmutable' 2>/dev/null || echo unknown)"
          if [ "$immutable" != "true" ]; then
            echo "::warning title=Release immutability not enabled::Enable Settings → Releases → Enable release immutability. This release was published mutable."
          else
            echo "Release is immutable."
          fi
