[package]
name = "deveco-desktop"
version = "0.2.0"
description = "DevEco Code 的 macOS 桌面客户端"
license = "MIT"
publish = false
edition = "2021"
rust-version = "1.77"
default-run = "deveco-desktop"

[lib]
name = "deveco_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
selftest = []

[[bin]]
name = "deveco-desktop"
path = "src/main.rs"

[[bin]]
name = "deveco-selftest"
path = "src/bin/selftest.rs"
required-features = ["selftest"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "=2.7.0"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
dirs = "6"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
jsonc-parser = { version = "0.21", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
